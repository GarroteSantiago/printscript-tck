plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
// TODO: uncomment to be able to fetch packages in your own repository
//    maven {
//        name = "GitHubPackages"
//        url = uri("https://maven.pkg.github.com/<your-username>/printscript")
//        credentials {
//            username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
//            password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
//        }
//    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "2m" // initial heap size
    maxHeapSize = "8m" // maximum heap size
    forkEvery = 1
}

dependencies {
    testImplementation 'junit:junit:4.13.1'

    implementation 'org.printscript:application:1.1.0'
    implementation 'org.printscript:interpreter:1.1.0'
    implementation 'org.printscript:formatter:1.1.0'
    implementation 'org.printscript:analyzer:1.1.0'
    implementation 'org.printscript:diagnostics:1.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo"
    useJUnit()
}
